<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Variant F: split screen — faceted emerald panel + receipt -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #03140e; }
  :root { --accent: #4fdc9f; --accent-hi: #e9fff5; --accent-mid: #a6f5cf; --glow: rgba(60, 220, 150, .45); --muted: #86a99a; }
  .gold { --accent: #e3c27a; --accent-hi: #fff6dc; --accent-mid: #f3dca4; --glow: rgba(230, 190, 100, .45); }
  .card { position: relative; width: 1280px; height: 720px; overflow: hidden; display: flex; font-family: "Inter", sans-serif; color: #eafff5; background: #04170f; }

  .panel { position: relative; width: 500px; height: 100%; overflow: hidden; }
  .panel svg { position: absolute; inset: 0; }
  .gold .panel svg { filter: hue-rotate(-108deg) saturate(.85) brightness(1.1); }
  .panel .label { position: absolute; left: 56px; bottom: 56px; right: 56px; }
  .panel .label .k { font-size: 18px; letter-spacing: 6px; font-weight: 700; color: rgba(4, 23, 15, .75); }
  .panel .label .v { font-size: 64px; font-weight: 800; letter-spacing: -1px; color: #04170f; margin-top: 4px; line-height: 1; }
  .panel .brand { position: absolute; left: 56px; top: 52px; font-weight: 800; font-size: 22px; letter-spacing: 8px; color: #04170f; }

  .rc { flex: 1; position: relative; padding: 56px 72px 0 72px;
    background: radial-gradient(ellipse 700px 500px at 30% 30%, #0a3626 0%, #04170f 70%); }
  .top { display: flex; justify-content: space-between; font-size: 20px; color: var(--muted); letter-spacing: 1px; }
  .top b { color: var(--accent); letter-spacing: 5px; font-weight: 700; }
  .amount {
    margin-top: 46px; font-weight: 800; font-size: 150px; line-height: 1; letter-spacing: -4px; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--accent-hi), var(--accent-mid) 50%, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 24px var(--glow));
  }
  .amount small { font-size: 76px; vertical-align: 52px; letter-spacing: 0; margin-right: 6px; }
  .sub { font-size: 22px; color: var(--muted); margin-top: 10px; }

  dl { margin-top: 40px; border-top: 1px dashed rgba(150, 240, 200, .22); }
  dl div { display: flex; align-items: baseline; gap: 14px; padding: 15px 0; border-bottom: 1px dashed rgba(150, 240, 200, .14); font-size: 24px; }
  dt { color: var(--muted); }
  dd { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  dd em { font-style: normal; color: var(--accent); font-weight: 600; margin-left: 8px; }
  .stamp {
    position: absolute; right: 64px; bottom: 44px; transform: rotate(-8deg);
    padding: 10px 22px; border: 3px solid var(--accent); border-radius: 12px; color: var(--accent);
    font-weight: 800; font-size: 24px; letter-spacing: 6px; opacity: .85;
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="panel">
    <svg width="500" height="720" viewBox="0 0 500 720">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6ff0b8"/><stop offset=".55" stop-color="#22b07a"/><stop offset="1" stop-color="#0c5a3f"/>
        </linearGradient>
      </defs>
      <rect width="500" height="720" fill="url(#pg)"/>
      <!-- large faceted crystal pattern -->
      <g stroke="rgba(4,40,28,.35)" stroke-width="1.5" stroke-linejoin="round">
        <polygon points="0,0 260,0 140,190" fill="rgba(255,255,255,.16)"/>
        <polygon points="260,0 500,0 500,150 360,230" fill="rgba(255,255,255,.08)"/>
        <polygon points="260,0 360,230 140,190" fill="rgba(255,255,255,.22)"/>
        <polygon points="0,0 140,190 0,330" fill="rgba(0,40,25,.10)"/>
        <polygon points="140,190 360,230 300,420 90,400" fill="rgba(255,255,255,.12)"/>
        <polygon points="360,230 500,150 500,470 300,420" fill="rgba(0,40,25,.14)"/>
        <polygon points="0,330 140,190 90,400 0,520" fill="rgba(255,255,255,.05)"/>
        <polygon points="90,400 300,420 230,720 0,720 0,520" fill="rgba(0,40,25,.18)"/>
        <polygon points="300,420 500,470 500,720 230,720" fill="rgba(0,40,25,.28)"/>
      </g>
      <polygon points="190,40 240,40 120,260 100,200" fill="#fff" opacity=".12"/>
    </svg>
    <div class="brand">EMERALD</div>
    <div class="label"><div class="k">ВОРКЕР</div><div class="v" id="worker">lastsignal</div></div>
  </div>

  <div class="rc">
    <div class="top"><b id="badge">НОВЫЙ ДЕПОЗИТ</b><span id="when">10.10.2026 · 19:55</span></div>
    <div class="amount"><small>$</small><span id="amount">647</span></div>
    <div class="sub">зачислено на счёт команды</div>
    <dl>
      <div><dt>Номер</dt><dd id="num">#1284</dd></div>
      <div><dt>Метод</dt><dd id="method">USDT TRC20</dd></div>
      <div><dt>Выплата воркеру</dt><dd><span id="payout">$420</span><em id="share">65%</em></dd></div>
      <div><dt>Итог дня</dt><dd id="today">$4 820</dd></div>
    </dl>
    <div class="stamp">PAID</div>
  </div>
</div>
<script src="deposit-fill.js"></script>
