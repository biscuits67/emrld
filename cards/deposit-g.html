<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Variant G: trading-terminal style with the day's cumulative chart -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #020d09; }
  :root { --accent: #4fdc9f; --accent-hi: #e9fff5; --accent-mid: #a6f5cf; --glow: rgba(60, 220, 150, .5); --muted: #7c9c8f; --line: rgba(150, 240, 200, .09); }
  .gold { --accent: #e3c27a; --accent-hi: #fff6dc; --accent-mid: #f3dca4; --glow: rgba(230, 190, 100, .5); }
  .card { position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: "Inter", sans-serif; color: #eafff5;
    background: radial-gradient(ellipse 900px 500px at 70% 100%, #0a3a28 0%, #031710 55%, #020d09 100%); }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 84px; display: flex; align-items: center; padding: 0 56px; gap: 28px;
    border-bottom: 1px solid var(--line); background: rgba(255,255,255,.015); }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 20px; letter-spacing: 7px; }
  .brand i { width: 22px; height: 22px; border-radius: 6px; transform: rotate(45deg) scale(.8); background: linear-gradient(135deg, #8af0c4, #14905e); }
  .pair { font-size: 18px; color: var(--muted); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); }
  .pair b { color: #eafff5; }
  .live { margin-left: auto; font-size: 17px; letter-spacing: 3px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px; }
  .live::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 22%, transparent); }

  .main { position: absolute; left: 56px; top: 124px; width: 520px; }
  .badge { font-size: 18px; letter-spacing: 5px; font-weight: 700; color: var(--muted); }
  .amount {
    margin-top: 12px; font-weight: 800; font-size: 136px; line-height: 1; letter-spacing: -4px; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px var(--glow));
  }
  .amount small { font-size: 70px; vertical-align: 46px; letter-spacing: 0; margin-right: 4px; }
  .delta { margin-top: 16px; display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  .delta::before { content: "▲"; font-size: 14px; }

  .stats { position: absolute; left: 56px; bottom: 56px; width: 520px; display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .stats > div { background: #041a12; padding: 18px 22px; }
  .stats .k { font-size: 14px; letter-spacing: 3px; color: var(--muted); font-weight: 600; }
  .stats .v { font-size: 26px; font-weight: 700; margin-top: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .chartbox { position: absolute; right: 56px; top: 124px; width: 600px; height: 540px; border-radius: 22px; border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.005)); overflow: hidden; }
  .ch { position: absolute; left: 26px; top: 22px; right: 26px; display: flex; justify-content: space-between; font-size: 16px; letter-spacing: 3px; color: var(--muted); font-weight: 600; }
  .ch b { color: #eafff5; letter-spacing: 0; font-size: 20px; }
  #chart { position: absolute; left: 0; top: 70px; }
  .goal-tag { position: absolute; right: 22px; font-size: 14px; color: var(--muted); letter-spacing: 2px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="bar">
    <div class="brand"><i></i>EMERALD</div>
    <div class="pair">Депозит <b id="num">#1284</b></div>
    <div class="pair" id="method">USDT TRC20</div>
    <div class="live" id="when">19:55</div>
  </div>

  <div class="main">
    <div class="badge" id="badge">НОВЫЙ ДЕПОЗИТ</div>
    <div class="amount"><small>$</small><span id="amount">647</span></div>
    <div class="delta" id="delta">+15.5% к дню</div>
  </div>

  <div class="stats">
    <div><div class="k">ВОРКЕР</div><div class="v" id="worker">lastsignal</div></div>
    <div><div class="k">ВЫПЛАТА</div><div class="v" id="payout">$420</div></div>
    <div><div class="k">ЗА ДЕНЬ</div><div class="v" id="today">$4 820</div></div>
    <div><div class="k">ДЕПОЗИТОВ</div><div class="v" id="count">12</div></div>
  </div>

  <div class="chartbox">
    <div class="ch"><span>ОБОРОТ ЗА ДЕНЬ</span><span>цель <b id="goal">$10 000</b></span></div>
    <svg id="chart" width="600" height="470"></svg>
  </div>
</div>
<script src="deposit-fill.js"></script>
<script>
  // Cumulative step chart from ?chart=v1,v2,... (deposit sums in order); last point is this deposit.
  (() => {
    const q = Object.fromEntries(new URLSearchParams(location.search));
    const deps = (q.chart || '180,240,410,150,520,300,960,280,350,180,1180,647').split(',').map(Number);
    const goal = Number(q.goal || 10000);
    let acc = 0; const pts = deps.map((d) => (acc += d));
    const today = pts[pts.length - 1], last = deps[deps.length - 1];
    if (document.getElementById('delta')) document.getElementById('delta').textContent = '+' + (last / (today - last) * 100).toFixed(1) + '% к дню';

    const W = 600, H = 470, padL = 26, padR = 26, padT = 30, padB = 40;
    const max = Math.max(goal, today) * 1.04;
    const x = (i) => padL + (W - padL - padR) * (i / (pts.length - 1));
    const y = (v) => padT + (H - padT - padB) * (1 - v / max);
    const css = getComputedStyle(document.getElementById('card'));
    const accent = css.getPropertyValue('--accent').trim();

    let d = `M${x(0)},${y(0)}`;
    pts.forEach((v, i) => { d += ` L${x(i)},${y(i ? pts[i - 1] : 0)} L${x(i)},${y(v)}`; });
    const svg = document.getElementById('chart');
    const grid = [0.25, 0.5, 0.75].map((f) => `<line x1="${padL}" x2="${W - padR}" y1="${y(goal * f)}" y2="${y(goal * f)}" stroke="rgba(150,240,200,.07)"/>`).join('');
    const lx = x(pts.length - 1), ly = y(today), py = y(pts[pts.length - 2] || 0);
    svg.innerHTML = `
      <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${accent}" stop-opacity=".35"/><stop offset="1" stop-color="${accent}" stop-opacity="0"/></linearGradient></defs>
      ${grid}
      <line x1="${padL}" x2="${W - padR}" y1="${y(goal)}" y2="${y(goal)}" stroke="${accent}" stroke-opacity=".5" stroke-dasharray="6 8"/>
      <path d="${d} L${lx},${H - padB} L${x(0)},${H - padB} Z" fill="url(#fill)"/>
      <path d="${d}" fill="none" stroke="${accent}" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="${lx}" cy="${ly}" r="16" fill="${accent}" opacity=".25"/>
      <circle cx="${lx}" cy="${ly}" r="7" fill="#fff"/>`;
    const tag = document.createElement('div');
    tag.className = 'goal-tag'; tag.textContent = 'ЦЕЛЬ'; tag.style.top = (70 + y(goal) - 24) + 'px';
    document.querySelector('.chartbox').append(tag);
  })();
</script>
