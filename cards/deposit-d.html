<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Variant D: square, same visual language as template.html section cards -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 1280px; overflow: hidden; background: #03140e; }
  :root { --accent: #4fdc9f; --accent-hi: #e9fff5; --accent-mid: #a6f5cf; --glow: rgba(60, 220, 150, .45); --muted: #8fb8a6; }
  .gold { --accent: #e3c27a; --accent-hi: #fff6dc; --accent-mid: #f3dca4; --glow: rgba(230, 190, 100, .45); }
  .card {
    position: relative; width: 1280px; height: 1280px; overflow: hidden;
    font-family: "Inter", sans-serif; color: #eafff5; text-align: center;
    background:
      radial-gradient(ellipse 620px 560px at 640px 380px, rgba(18, 110, 72, .55), transparent 70%),
      radial-gradient(ellipse 900px 900px at 640px 560px, #0c4430 0%, #073020 45%, #031a12 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(120, 220, 170, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 220, 170, .05) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(ellipse 560px 520px at 640px 420px, #000 30%, transparent 80%);
            mask-image: radial-gradient(ellipse 560px 520px at 640px 420px, #000 30%, transparent 80%);
  }
  svg.art { position: absolute; left: 0; top: 0; }
  .gold svg.art, .gold .grid { filter: hue-rotate(-108deg) saturate(.85) brightness(1.12); }
  .top { position: absolute; left: 80px; right: 80px; top: 70px; display: flex; justify-content: space-between;
    font-size: 30px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .top b { color: #eafff5; font-weight: 700; letter-spacing: 8px; }
  .badge { position: absolute; left: 0; right: 0; top: 620px; font-weight: 700; font-size: 30px; letter-spacing: 12px; color: var(--accent); }
  .amount {
    position: absolute; left: 0; right: 0; top: 670px;
    font-weight: 800; font-size: 250px; line-height: 1; letter-spacing: -6px; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--accent-hi) 0%, var(--accent-mid) 45%, var(--accent) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 30px var(--glow));
  }
  .amount small { font-size: 120px; vertical-align: 90px; letter-spacing: 0; margin-right: 8px; }
  .pill-wrap { position: absolute; left: 0; right: 0; top: 990px; display: flex; justify-content: center; }
  .pill {
    height: 110px; padding: 0 60px; display: flex; align-items: center; gap: 22px; border-radius: 55px;
    border: 2px solid rgba(201, 176, 112, .55);
    background: linear-gradient(180deg, rgba(40, 42, 28, .85), rgba(14, 26, 18, .9));
    box-shadow: inset 0 1px 0 rgba(255, 235, 180, .08), 0 10px 40px rgba(0, 0, 0, .35);
    font-weight: 700; font-size: 50px; color: #d8bf86; white-space: nowrap;
  }
  .pill span { font-size: 26px; letter-spacing: 6px; color: rgba(216, 191, 134, .65); }
  .foot { position: absolute; left: 0; right: 0; bottom: 70px; font-size: 28px; color: var(--muted); }
  .foot b { color: #eafff5; }
</style>
</head>
<body>
<div class="card" id="card">

        <polygon points="578,593 700,593 740,670 540,670" fill="#0c5a3f"/>
        <polygon points="583,342 700,342 737,380 737,555 700,593 578,593 543,555 543,380" fill="url(#table)"/>
      </g>
      <polygon points="600,342 650,342 566,488 566,400" fill="#ffffff" opacity=".10"/>
      <g stroke-linejoin="round" stroke-linecap="round" fill="none">

</div>
